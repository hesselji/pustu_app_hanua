name: pustu_app_hanua
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^2.25.4
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.0

  provider: ^6.0.5
  intl: ^0.18.1
  connectivity_plus: ^6.0.3

  # EXPORT PDF
  pdf: ^3.11.0
  printing: ^5.12.0

  # EXPORT EXCEL
  excel: ^4.0.3

  # SIMPAN FILE
  path_provider: ^2.1.3

  # OPEN FILE HASIL EXPORT
  open_filex: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  flutter_lints: ^5.0.0

# APP ICON
flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo_pustu.png"

# SPLASH SCREEN
flutter_native_splash:
  color: "#F5F7FA"
  image: assets/logo_pustu.png

  android: true
  ios: true

  android_12:
    image: assets/logo_pustu.png
    icon_background_color: "#F5F7FA"

flutter:
  uses-material-design: true

  assets:
    - assets/logo_pustu.png
    - assets/logo_bakti_husada.png
    - assets/logo_kemenkes.png